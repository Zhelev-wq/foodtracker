---
services:

  migrate:
    build: .
    command: uv run alembic upgrade head
    env_file:
      - path: .env
        required: true
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy


  app:
    image: fastapi_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 7070:8000
    env_file:
      - path: .env
        required: true
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18.4
    volumes:
      - postgres-data:/var/lib/postgresql/
    networks:
      - private
    environment:
      POSTGRES_USER: ${USERNAME}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:

networks:
  private:
    driver: bridge
